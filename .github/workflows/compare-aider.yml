# Compares diane's code map to aider's repo-map on a real
# repository, and publishes the result to the run's job summary.
#
# This is an INFORMATIONAL workflow, not a merge gate. It is not wired
# to push/pull_request because it installs aider (a heavy Python
# dependency) and the comparison outcome is a report to read, not a
# pass/fail signal. It runs on demand (the "Run workflow" button) and
# once a month so the numbers don't go stale. The job only fails if
# the comparison tooling itself errors — never because of how the two
# maps stack up.
#
# Cost: zero LLM/API spend. `aider --show-repo-map` builds the map
# locally with tree-sitter and exits; no model is ever called. The
# dummy OPENAI_API_KEY below only exists because aider wants the
# variable set at startup — it is never used to make a request.
name: compare-aider

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Git URL of the repository to compare on"
        required: true
        default: "https://github.com/BurntSushi/byteorder.git"
      map_tokens:
        description: "aider --map-tokens budget for the repo-map"
        required: true
        default: "4096"
  schedule:
    # 06:00 UTC on the 1st of each month — keeps the comparison fresh
    # against new aider releases without any manual prompting.
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  compare:
    name: aider repo-map vs diane code-map
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aider
        # aider-chat ships tree-sitter grammars; --show-repo-map needs
        # no model call, but the package install is the slow step.
        run: pip install aider-chat

      - name: Install plugin dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin
        run: bun run build

      - name: Clone the target repository
        # Shallow but with enough history for a representative repo;
        # the comparison only reads the working tree, not deep history.
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/BurntSushi/byteorder.git' }}"
          echo "Cloning $REPO_URL"
          git clone --depth 60 --quiet "$REPO_URL" target-repo
          echo "files: $(cd target-repo && git ls-files | wc -l)"

      - name: Generate aider repo-map
        # aider needs OPENAI_API_KEY *set* to start, but --show-repo-map
        # exits before any API call — the value is never used. Tolerate
        # a non-zero exit: the compare step reports a missing map
        # clearly rather than failing the job.
        env:
          OPENAI_API_KEY: unused-show-repo-map-makes-no-api-calls
        run: |
          MAP_TOKENS="${{ github.event.inputs.map_tokens || '4096' }}"
          cd target-repo
          aider --show-repo-map --map-tokens "$MAP_TOKENS" \
                --model gpt-4o-mini --yes --no-gitignore \
                > ../aider-raw.txt 2> ../aider-stderr.txt || true
          cd ..
          # Strip aider's CLI startup banner — keep from its repo-map
          # preamble onward. Fall back to the raw output if the marker
          # isn't found (a future aider may word it differently).
          if grep -q "Here are summaries" aider-raw.txt; then
            sed -n '/Here are summaries/,$p' aider-raw.txt > aider-map.txt
          else
            cp aider-raw.txt aider-map.txt
          fi
          echo "aider map: $(wc -l < aider-map.txt) lines"

      - name: Generate diane code-map
        run: |
          bun scripts/dump-code-map.mjs target-repo > diane-map.txt 2> diane-stderr.txt || true
          echo "diane map: $(wc -l < diane-map.txt) lines"
          cat diane-stderr.txt

      - name: Compare and publish report
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/BurntSushi/byteorder.git' }}"
          REPO_NAME="$(basename "$REPO_URL" .git)"
          bun scripts/compare-aider.mjs aider-map.txt diane-map.txt --repo "$REPO_NAME" \
            > comparison-report.md
          # Publish to the run's job summary so it's readable without
          # downloading anything.
          cat comparison-report.md >> "$GITHUB_STEP_SUMMARY"
          cat comparison-report.md

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aider-comparison
          path: |
            comparison-report.md
            aider-map.txt
            diane-map.txt
            aider-stderr.txt
            diane-stderr.txt
          retention-days: 30
          if-no-files-found: warn
